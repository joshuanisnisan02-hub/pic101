name: Publish PIC101 Course

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify course contents
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test "$(find . -maxdepth 1 -name '*.html' | wc -l)" -eq 38
          if grep -R -n --include='*.html' 'Elenito G. David' .; then
            echo 'Old instructor name still exists.' >&2
            exit 1
          fi
          grep -R -q --include='*.html' 'Joshua E. Nisnisan' .

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live site
        shell: bash
        run: |
          set -euo pipefail
          url='${{ steps.deployment.outputs.page_url }}'
          echo "Checking $url"
          for attempt in $(seq 1 30); do
            if curl -fsSL "$url" | grep -q 'Professional Issues'; then
              echo "PIC101 is live at $url"
              exit 0
            fi
            sleep 5
          done
          echo "GitHub Pages did not become reachable during verification." >&2
          exit 1
