name: Publish PIC101 Course

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify course contents
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test "$(find . -maxdepth 1 -name '*.html' | wc -l)" -eq 38
          if grep -R -n --include='*.html' 'Elenito G. David' .; then
            echo 'Old instructor name still exists.' >&2
            exit 1
          fi
          grep -R -q --include='*.html' 'Joshua E. Nisnisan' .

      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          force_orphan: true
          exclude_assets: '.github,README.md'
