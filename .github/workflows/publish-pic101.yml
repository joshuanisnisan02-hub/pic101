name: Publish PIC101 Course

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify course contents
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test "$(find . -maxdepth 1 -name '*.html' | wc -l)" -eq 38
          if grep -R -n --include='*.html' 'Elenito G. David' .; then
            echo 'Old instructor name still exists.' >&2
            exit 1
          fi
          grep -R -q --include='*.html' 'Joshua E. Nisnisan' .

      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          force_orphan: true
          exclude_assets: '.github,README.md'

      - name: Enable GitHub Pages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages"
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api")
          if [ "$code" = '404' ]; then
            curl --fail-with-body -sS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api" \
              -d '{"source":{"branch":"gh-pages","path":"/"}}'
          elif [ "$code" = '200' ]; then
            curl --fail-with-body -sS -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api" \
              -d '{"source":{"branch":"gh-pages","path":"/"}}'
          else
            cat /tmp/pages.json
            echo "Unexpected Pages API status: $code" >&2
            exit 1
          fi

      - name: Verify live site
        shell: bash
        run: |
          set -euo pipefail
          url='https://joshuanisnisan02-hub.github.io/pic101/'
          for attempt in $(seq 1 30); do
            if curl -fsSL "$url" | grep -q 'Professional Issues'; then
              echo "PIC101 is live at $url"
              exit 0
            fi
            sleep 5
          done
          echo "GitHub Pages did not become reachable during verification." >&2
          exit 1
