<script>const slides=[{"kind":"PIC 101","title":"Privacy by Design, Rights, and Breach Response","lead":"Week 7 · Session 2 · Professional Issues in Computing","points":[],"two":[],"case":""},{"kind":"Topic introduction","title":"What this lesson is about","lead":"This lesson explains privacy by design, rights, and breach response as one connected professional topic. It begins with the foundation, develops the essential ideas in a logical order, and ends by applying them to a realistic computing situation.","points":["Students will first understand the basic meaning of the topic before examining its individual ideas.","Each idea is explained in plain language and connected to an example, so the lesson can be reviewed even without a spoken explanation.","The final situation shows how the ideas guide an actual professional decision."],"two":[],"case":""},{"kind":"Foundation","title":"Where the topic begins","lead":"The foundation of privacy by design, rights, and breach response is that computing decisions affect people, organizations, and society. Technical knowledge explains what a system can do; professional judgment helps determine what it should do and how it should be used.","points":["A working system is not automatically a responsible system.","Professionals must consider purpose, evidence, affected people, possible harm, authorization, and follow-through.","The concepts in the next slides provide the language needed to make that judgment."],"two":[],"case":""},{"kind":"Lesson map","title":"Ideas you will learn","lead":"The lesson moves from basic meaning to professional application. These ideas are connected rather than separate definitions.","points":["Privacy by Design","Data Minimization","Data Subject Rights","Retention","Security Safeguards","Breach Response"],"two":[],"case":""},{"kind":"Foundation","title":"Privacy by Design","lead":"Including privacy protections in requirements, design, defaults, development, operation, and disposal instead of adding them only after a problem.","points":["<strong>Begin with purpose:</strong> Define why personal data is needed before choosing what to collect.","<strong>Minimize by default:</strong> Collect, expose, and retain the least data necessary.","<strong>Protect the full life cycle:</strong> Apply safeguards during collection, use, storage, sharing, and disposal.","<strong>Make choices understandable:</strong> Explain processing clearly and provide meaningful controls where appropriate.","<strong>Review continuously:</strong> Test privacy risks and correct them as the system, data, or context changes."],"two":[],"case":""},{"kind":"Foundation","title":"Data Minimization","lead":"Collecting and keeping only the information that is adequate, relevant, and necessary for the stated purpose.","points":["<strong>Main components:</strong> This idea includes the people, processes, technologies, rules, and outcomes connected to data minimization.","<strong>How it is examined:</strong> Use the definition—collecting and keeping only the information that is adequate, relevant, and necessary for the stated purpose.—to identify what evidence should be checked.","<strong>Why it matters:</strong> Understanding these components helps professionals move from a general term to a clear and responsible action."],"two":[],"case":""},{"kind":"Key concept","title":"Data Subject Rights","lead":"Protections that allow people to be informed and, when applicable, access, correct, object to, erase, or otherwise act regarding their data.","points":["<strong>Purpose and necessity:</strong> Identify why information is needed and avoid collecting or keeping data without a justified reason.","<strong>People and rights:</strong> Explain processing clearly and respect the choices and protections available to affected individuals.","<strong>Data life cycle:</strong> Consider collection, access, use, sharing, storage, correction, retention, and disposal.","<strong>Protection and accountability:</strong> Limit access, apply safeguards, document decisions, and respond when information is exposed."],"two":[],"case":""},{"kind":"Key concept","title":"Retention","lead":"Keeping information only for an authorized purpose and an appropriate period, followed by secure disposal or anonymization.","points":["<strong>Purpose and necessity:</strong> Identify why information is needed and avoid collecting or keeping data without a justified reason.","<strong>People and rights:</strong> Explain processing clearly and respect the choices and protections available to affected individuals.","<strong>Data life cycle:</strong> Consider collection, access, use, sharing, storage, correction, retention, and disposal.","<strong>Protection and accountability:</strong> Limit access, apply safeguards, document decisions, and respond when information is exposed."],"two":[],"case":""},{"kind":"Professional meaning","title":"Security Safeguards","lead":"Organizational, physical, and technical measures used to protect information and systems against loss, misuse, unauthorized access, or disclosure.","points":["<strong>Assets:</strong> Identify the information, service, device, account, or person that needs protection.","<strong>Threats and weaknesses:</strong> Determine what could cause harm and which weakness could make it possible.","<strong>Controls:</strong> Use prevention, detection, response, recovery, and user awareness together.","<strong>Review:</strong> Monitor results, report warning signs, and improve controls when conditions change."],"two":[],"case":""},{"kind":"Professional meaning","title":"Breach Response","lead":"The coordinated process of containing an exposure, assessing impact, preserving evidence, notifying appropriate parties, correcting causes, and learning from it.","points":["<strong>Main components:</strong> This idea includes the people, processes, technologies, rules, and outcomes connected to breach response.","<strong>How it is examined:</strong> Use the definition—the coordinated process of containing an exposure, assessing impact, preserving evidence, notifying appropriate parties, correcting causes, and learning from it.—to identify what evidence should be checked.","<strong>Why it matters:</strong> Understanding these components helps professionals move from a general term to a clear and responsible action."],"two":[],"case":""},{"kind":"Whole-topic connection","title":"How the ideas fit together","lead":"Privacy by Design, Rights, and Breach Response is best understood as a sequence: establish the foundation, examine the people and conditions involved, then decide what responsible practice requires.","points":["Begin with Privacy by Design and Data Minimization to understand the foundation.","Use Data Subject Rights and Retention to examine how the issue operates in practice.","Apply Security Safeguards and Breach Response when choosing and defending the professional response."],"two":[],"case":""},{"kind":"Application","title":"Read the situation","lead":"Use the lesson concepts to understand the problem before choosing an answer.","points":["Identify what is already known and what still needs verification.","Determine who can benefit, who may be harmed, and who has authority or responsibility.","Connect the situation to the lesson concepts before recommending action."],"two":[],"case":"A clinic discovers that patient records were accidentally exposed through a shared link."},{"kind":"Guided explanation","title":"How to analyze the situation","lead":"A responsible analysis moves from evidence to action. It does not begin with a quick opinion.","points":["Facts — separate verified information from assumptions.","People — identify direct and indirect stakeholders, especially those with less power.","Responsibilities — connect the situation to professional duties, rules, rights, and standards.","Options — compare realistic actions and the likely effect of each one.","Safeguards — reduce foreseeable harm and identify who will review the result."],"two":[],"case":""},{"kind":"Worked example","title":"A defensible professional response","lead":"A strong response states what should happen, why it is justified, and how people will be protected.","points":["Recommended direction: pause or limit the action when essential evidence, authorization, or safeguards are missing.","Reason: professional decisions must consider the lesson concepts and the effect on people—not only speed, convenience, or cost.","Safeguard: verify the missing information, involve the correct authority, document the decision, and review the result after action."],"two":[],"case":"A clinic discovers that patient records were accidentally exposed through a shared link."},{"kind":"Class application","title":"Discuss and decide","lead":"Work with a partner or small group. Explain the case in your own words, then develop one professional recommendation.","points":["Use at least three concepts from the lesson.","State one benefit, one possible harm, and one missing fact.","Give a specific action, reason, safeguard, responsible person, and review point.","Be ready to explain why your response is stronger than at least one alternative."],"two":[],"case":""},{"kind":"Check your understanding","title":"Can you explain the lesson?","lead":"Answer using complete thoughts rather than copying a definition.","points":["What is the central idea of Privacy by Design, Rights, and Breach Response?","How do Privacy by Design and Data Minimization establish the foundation?","Why are Data Subject Rights and Retention important in practice?","How do Security Safeguards and Breach Response improve the final decision?","Give a new example where this lesson would matter."],"two":[],"case":""},{"kind":"Lesson summary","title":"Privacy by Design, Rights, and Breach Response","lead":"The topic is complete when its ideas lead to an informed, responsible, and reviewable professional action.","points":["Foundation: Privacy by Design and Data Minimization e
