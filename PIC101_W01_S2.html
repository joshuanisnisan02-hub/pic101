-size:29px;line-height:1.5;color:#dbe4f2;max-width:1180px;margin-top:25px}.list{display:grid;gap:10px;max-width:1580px;margin-top:8px}.item{position:relative;padding:10px 12px 10px 34px;border-top:1px solid var(--line);font-size:25px;line-height:1.38;color:#343a44}.item::before{content:"";position:absolute;left:4px;top:24px;width:10px;height:10px;border-radius:50%;background:var(--accent)}.item strong{color:var(--accent)}.card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:18px}.card{min-height:118px;padding:22px 24px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--accent) 5%,var(--paper));font-size:24px;line-height:1.35;color:#343a44}.card strong{display:block;color:var(--accent);font-family:Georgia,"Times New Roman",serif;font-size:27px;margin-bottom:7px}.case{margin-top:22px;padding:25px 30px;border-left:6px solid var(--accent);background:var(--accent-soft);font-family:Georgia,"Times New Roman",serif;font-size:29px;line-height:1.4;color:#1c2e4c}.activity .case{background:#fffdf8}.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:24px}.summary-card{padding:28px;border-top:5px solid var(--accent);background:var(--white);font-size:25px;line-height:1.42;color:#353c47}.counter{position:absolute;right:42px;top:34px;font:18px Consolas,"Courier New",monospace;color:#66707e}.brand{position:absolute;left:44px;bottom:31px;font:17px Consolas,"Courier New",monospace;color:#81858b}.section .counter,.section .brand{color:#c7d5ec}.chrome{position:fixed;inset:0;pointer-events:none;z-index:20}.home,.full,.prev,.next{pointer-events:auto;position:absolute;border:1px solid #ffffff45;background:#0d2a54e8;color:#fff;border-radius:9px;padding:10px 14px;font:700 14px "Segoe UI",Arial;cursor:pointer;box-shadow:0 5px 18px #0003}.home{left:16px;top:16px}.full{right:16px;top:16px}.prev{left:16px;bottom:16px}.next{right:16px;bottom:16px;background:#c88916;color:#101826;border-color:#f0c367}.home:hove <script>const slides=[{"kind":"PIC 101","title":"History of Computing, Society, and Professional Practice","lead":"Week 1 · Session 2 · Professional Issues in Computing","points":[],"two":[],"case":""},{"kind":"Topic introduction","title":"What this lesson is about","lead":"This lesson explains history of computing, society, and professional practice as one connected professional topic. It begins with the foundation, develops the essential ideas in a logical order, and ends by applying them to a realistic computing situation.","points":["Students will first understand the basic meaning of the topic before examining its individual ideas.","Each idea is explained in plain language and connected to an example, so the lesson can be reviewed even without a spoken explanation.","The final situation shows how the ideas guide an actual professional decision."],"two":[],"case":""},{"kind":"Foundation","title":"Where the topic begins","lead":"The foundation of history of computing, society, and professional practice is that computing decisions affect people, organizations, and society. Technical knowledge explains what a system can do; professional judgment helps determine what it should do and how it should be used.","points":["A working system is not automatically a responsible system.","Professionals must consider purpose, evidence, affected people, possible harm, authorization, and follow-through.","The concepts in the next slides provide the language needed to make that judgment."],"two":[],"case":""},{"kind":"Lesson map","title":"Ideas you will learn","lead":"The lesson moves from basic meaning to professional application. These ideas are connected rather than separate definitions.","points":["History of Computing","Social Context","Technology Adoption","Unintended Consequences","Public Benefit","Professional Responsibility"],"two":[],"case":""},{"kind":"Foundation","title":"History of Computing","lead":"Computing developed through several major stages. Each stage introduced a new way to represent information, process instructions, store data, or connect people. The timeline below shows what changed and why it mattered.","points":["<strong>Early calculation:</strong> The abacus and other counting devices helped people perform arithmetic more consistently.","<strong>Mechanical machines:</strong> Inventors such as Pascal and Leibniz built devices that used gears to calculate. Babbage later proposed programmable mechanical machines, while Ada Lovelace described how instructions could be used with them.","<strong>Punched-card processing:</strong> Punched cards allowed information and instructions to be represented in a machine-readable form and were widely used for tabulation and early data processing.","<strong>Electronic computers:</strong> Early computers used vacuum tubes, followed by transistors and integrated circuits. Each change made computers smaller, faster, more reliable, and less expensive.","<strong>Personal computing:</strong> Microprocessors placed major computing functions on a small chip, helping computers move from specialized institutions into offices, schools, and homes.","<strong>Connected and mobile computing:</strong> The internet, web, smartphones, and cloud services allowed people to communicate, access information, and use computing resources from almost anywhere.","<strong>Current direction:</strong> Artificial intelligence, large-scale data, connected devices, and automation now allow systems to generate content, recognize patterns, and support decisions—creating new benefits and professional responsibilities."],"two":[],"case":""},{"kind":"Foundation","title":"Social Context","lead":"The social conditions surrounding technology, including culture, income, education, institutions, laws, and unequal access.","points":["<strong>Culture and language:</strong> People interpret interfaces, symbols, messages, and acceptable behavior differently.","<strong>Economic conditions:</strong> Income, device cost, connectivity, and available infrastructure affect who can use a system.","<strong>Education and digital skills:</strong> A service may be available but still unusable when people lack training or support.","<strong>Institutions and laws:</strong> Schools, workplaces, government, families, and legal rules shape how technology is introduced and controlled.","<strong>Existing inequality:</strong> Technology can reduce barriers, but poor design can also deepen exclusion that already exists."],"two":[],"case":""},{"kind":"Key concept","title":"Technology Adoption","lead":"The process through which people and organizations decide to accept, learn, integrate, or reject a technology.","points":["<strong>Awareness:</strong> People first learn that a technology exists and what problem it claims to solve.","<strong>Evaluation:</strong> Users compare usefulness, cost, difficulty, risk, compatibility, and available alternatives.","<strong>Trial and learning:</strong> Training, testing, and initial experience influence confidence and acceptance.","<strong>Integration:</strong> The technology becomes part of normal work only when processes, roles, support, and policies adapt to it.","<strong>Continued use or rejection:</strong> Users keep, modify, or abandon the technology based on actual results—not promises alone."],"two":[],"case":""},{"kind":"Key concept","title":"Unintended Consequences","lead":"Effects that were not part of the original goal, such as exclusion, dependency, new risks, or changes in behavior.","points":["<strong>Positive effects:</strong> A tool may create unexpected convenience, access, or new forms of cooperation.","<strong>Negative effects:</strong> It may create exclusion, dependency, privacy loss, unsafe shortcuts, job disruption, or new opportunities for abuse.","<strong>Unequal effects:</strong> A change that helps the majority can still place a serious burden on a smaller or less powerful group.","<strong>Delayed effects:</strong> Some consequences appear only after repeated use, wider adoption, or changes in user behavior.","<strong>Professional response:</strong> Teams should monitor actual outcomes, receive feedback, correct harm, and provide alternatives when needed."],"two":[],"case":""},{"kind":"Professional meaning","title":"Public Benefit","lead":"A positive result that improves welfare, access, safety, opportunity, knowledge, or trust for the wider community.","points":["<strong>Access:</strong> More people can reach useful information, education, services, or opportunities.","<strong>Safety and welfare:</strong> Technology can reduce danger, improve health, or support faster response to problems.","<strong>Efficiency with fairness:</strong> Time and resources may be saved without transferring unreasonable burdens to vulnerable users.","<strong>Knowledge and participation:</strong> Communities can become better informed and more able to take part in decisions.","<strong>Trust:</strong> Benefits are sustainable when systems are transparent, reliable, inclusive, and accountable."],"two":[],"case":""},{"kind":"Professional meaning","title":"Professional Responsibility","lead":"The duty to use computing knowledge competently, honestly, carefully, and with respect for people affected by the work.","points":["<strong>Competence:</strong> Accept work only when qualified or when proper supervision and learning are available.","<strong>Honesty:</strong> Communicate capabilities, limitations, evidence, and uncertainty truthfully.","<strong>Care:</strong> Test, protect information, anticipate misuse, and reduce foreseeable harm.","<strong>Respect:</strong> Consider privacy, dignity, fairness, accessibility, and the rights of affected people.","<strong>Accountability:</strong> Document decisions, correct mistakes, and remain responsible for results after deployment."],"two":[],"case":""},{"kind":"Whole-topic connection","title":"How the ideas fit together","lead":"History of Computing, Society, and Professional Practice is best understood as a sequence: establish the foundation, examine the people and conditions involved, then decide what responsible practice requires.","points":["Begin with History of Computing and Social Context to understand the foundation.","Use Technology Adoption and Unintended Consequences to examine how the issue operates in practice.","Apply Public Benefit and Professional Responsibility when choosing and defending the professional response."],"two":[],"case":""},{"kind":"Application","title":"Read the situation","lead":"Use the lesson concepts to understand the problem before choosing an answer.","points":["Identify what is already known and what still needs verification.","Determine who can benefit, who may be harmed, and who has authority or responsibility.","Connect the situation to the lesson concepts before recommending action."],"two":[],"case":"A city replaces a manual service with an online-only portal that many residents cannot use."},{"kind":"Guided explanation","title":"How to analyze the situation","lead":"A responsible analysis moves from evidence to action. It does not begin with a quick opinion.","points":["Facts — separate verified information from assumptions.","People — identify direct and indirect stakeholders, especially those with less power.","Responsibilities — connect the situation to professional duties, rules, rights, and standards.","Options — compare realistic actions and the likely effect of each one.","Safeguards — reduce foreseeable harm and identify who will review the result."],"two":[],"case":""},{"kind":"Worked example","title":"A defensible professional response","lead":"A strong response states what should happen, why it is justified, and how people will be protected.","points":["Recommended direction: pause or limit the action when essential evidence, authorization, or safeguards are missing.","Reason: professional decisions must consider the lesson concepts and the effect on people—not only speed, convenience, or cost.","Safeguard: verify the missing information, involve the correct authority, document the decision, and review the result after action."],"two":[],"case":"A city replaces a manual service with an online-only portal that many residents cannot use."},{"kind":"Class application","title":"Discuss and decide","lead":"Work with a partner or small group. Explain the case in your own words, then develop one professional recommendation.","points":["Use at least three concepts from the lesson.","State one benefit, one possible harm, and one missing fact.","Give a specific action, reason, safeguard, responsible person, and review point.","Be ready to explain why your response is stronger than at least one alternative."],"two":[],"case":""},{"kind":"Check your understanding","title":"Can you explain the lesson?","lead":"Answer using complete thoughts rather than copying a definition.","points":["What is the central idea of History of Computing, Society, and Professional Practice?","How do History of Computing and Social Context establish the foundation?","Why are Technology Adoption and Unintended Consequences important in practice?","How do Public Benefit and Professional Responsibility improve the final decision?","Give a new example where this lesson would matter."],"two":[],"case":""},{"kind":"Lesson summary","title":"History of Computing, Society, and Professional Practice","lead":"The topic is complete when its ideas lead to an informed, responsible, and reviewable professional action.","points":["Foundation: History of Computing and Social Context establish what the issue means and why it matters.","Practice: Technology Adoption and Unintended Consequences show how the issue affects real people and decisions.","Responsible action: Public Benefit and Professional Responsibility guide safeguards, accountability, and follow-through."],"two":[],"case":""}];let index=0;const $=id=>document.getElementById(id),canvas=$('canvas'),slide=$('slide'),content=$('content');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function emphasized(t){const clean=String(t??'').replace(/<\/?strong>/g,''),p=clean.split(/:\s*/,2);return p.length===2?'<strong>'+esc(p[0])+':</strong> '+esc(clean.slice(p[0].length+1).trim()):esc(clean)}function typeOf(s,n){if(n===0)return'title';if(['Whole-topic connection'].includes(s.kind))return'section';if(/Class application|Activity/i.test(s.kind))return'activity';return'content'}function render(){const s=slides[index],type=typeOf(s,index);slide.className='slide '+type;let h='';if(type==='title'){h='<span class="eyebrow">PIC 101 · '+esc('Week 1 · Session 2')+'</span><h1>'+esc(s.title)+'</h1><p class="subtitle">'+esc(s.lead)+'</p><span class="faculty">Joshua E. Nisnisan · Cronasia Foundation College</span>'}else if(type==='section'){h='<span class="eyebrow">'+esc(s.kind)+'</span><h2>'+esc(s.title)+'</h2><p class="lead">'+esc(s.lead)+'</p>'}else{h='<span class="eyebrow">'+esc(s.kind)+'</span><h2>'+esc(s.title)+'</h2>'+(s.lead?'<p class="lead">'+esc(s.lead)+'</p>':'');if(s.case)h+='<div class="case">'+esc(s.case)+'</div>';if(s.two?.length)h+='<div class="summary-grid">'+s.two.map(p=>'<div class="summary-card"><strong>'+esc(p[0])+'</strong><br>'+esc(p[1])+'</div>').join('')+'</div>';if(s.points?.length){if(s.kind==='Lesson map')h+='<div class="card-grid">'+s.points.map(p=>'<div class="card">'+emphasized(p)+'</div>').join('')+'</div>';else if(s.kind==='Lesson summary')h+='<div class="summary-grid">'+s.points.map(p=>'<div class="summary-card">'+emphasized(p)+'</div>').join('')+'</div>';else h+='<div class="list">'+s.points.map(p=>'<div class="item">'+emphasized(p)+'</div>').join('')+'</div>'}}content.innerHTML=h;$('counter').textContent=(index+1)+' / '+slides.length;$('prev').disabled=index===0;$('next').disabled=index===slides.length-1;[...document.querySelectorAll('.dot')].forEach((d,n)=>d.classList.toggle('active',n===index));location.hash='slide-'+(index+1)}function go(n){index=Math.max(0,Math.min(slides.length-1,n));render()}function scale(){const s=Math.min(innerWidth/1920,innerHeight/1080);canvas.style.setProperty('--scale',s)}$('prev').onclick=()=>go(index-1);$('next').onclick=()=>go(index+1);$('home').onclick=()=>location.href='index.html';$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();$('dots').innerHTML=slides.map((_,n)=>'<button class="dot" aria-label="Go to slide '+(n+1)+'" data-n="'+n+'"></button>').join('');document.querySelectorAll('.dot').forEach(d=>d.onclick=()=>go(+d.dataset.n));$('thumbs').innerHTML=slides.map((s,n)=>'<button class="thumb" data-n="'+n+'"><small>'+esc(s.kind)+'</small><b>'+esc(s.title)+'</b></button>').join('');document.querySelectorAll('.thumb').forEach(b=>b.onclick=()=>{go(+b.dataset.n);$('overview').classList.remove('open')});$('close').onclick=()=>$('overview').classList.remove('open');addEventListener('resize',scale);addEventListener('keydown',e=>{if($('overview').classList.contains('open')){if(e.key==='Escape')$('overview').classList.remove('open');return}if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(index+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(index-1)}if(e.key==='Home')go(0);if(e.key==='End')go(slides.length-1);if(e.key.toLowerCase()==='f')$('full').click();if(e.key.toLowerCase()==='o')$('overview').classList.add('open')});const hash=location.hash.match(/slide-(\d+)/);if(hash)index=Math.min(slides.length-1,Math.max(0,+hash[1]-1));scale();render();</script></body></html>
