<script>const slides=[{"kind":"PIC 101","title":"History of Computing, Society, and Professional Practice","lead":"Week 1 · Session 2 · Professional Issues in Computing","points":[],"two":[],"case":""},{"kind":"Why this matters","title":"Why this topic matters","lead":"The foundation of history of computing, society, and professional practice is that computing decisions affect people, organizations, and society. Technical knowledge explains what a system can do; professional judgment helps determine what it should do and how it should be used.","points":["Focus on the professional issue behind the technology, not only on the technical feature.","By the end of the lesson, the concepts should help you explain what a responsible computing professional should do."],"two":[],"case":""},{"kind":"Foundation","title":"Start with the foundation","lead":"These ideas establish the basic meaning of History of Computing, Society, and Professional Practice.","points":[],"two":[["History of Computing","Computing developed through several major stages. Each stage introduced a new way to represent information, process instructions, store data, or connect people. The timeline below shows what changed and why it mattered."],["Social Context","The social conditions surrounding technology, including culture, income, education, institutions, laws, and unequal access."]],"case":""},{"kind":"In practice","title":"See the issue in practice","lead":"These ideas show how the topic affects people, decisions, systems, or organizations in actual computing work.","points":[],"two":[["Technology Adoption","The process through which people and organizations decide to accept, learn, integrate, or reject a technology."],["Unintended Consequences","Effects that were not part of the original goal, such as exclusion, dependency, new risks, or changes in behavior."]],"case":""},{"kind":"Professional response","title":"What responsible practice requires","lead":"These ideas guide the professional response, including safeguards, justification, and accountability.","points":[],"two":[["Public Benefit","A positive result that improves welfare, access, safety, opportunity, knowledge, or trust for the wider community."],["Professional Responsibility","The duty to use computing knowledge competently, honestly, carefully, and with respect for people affected by the work."]],"case":""},{"kind":"Whole-topic connection","title":"How the ideas fit together","lead":"History of Computing, Society, and Professional Practice is best understood as a sequence: establish the foundation, examine the people and conditions involved, then decide what responsible practice requires.","points":["Begin with History of Computing and Social Context to understand the foundation.","Use Technology Adoption and Unintended Consequences to examine how the issue operates in practice.","Apply Public Benefit and Professional Responsibility when choosing and defending the professional response."],"two":[],"case":""},{"kind":"Application","title":"A realistic computing situation","lead":"Read the case first, then connect it to the lesson concepts before deciding what should happen.","points":["What is the main professional issue?","Who or what may be affected?","Which concepts from this lesson are most useful for understanding the problem?","What information is still missing before a responsible decision can be made?"],"two":[],"case":"A city replaces a manual service with an online-only portal that many residents cannot use."},{"kind":"Guided application","title":"From issue to professional action","lead":"Use the lesson concepts as a decision path.","points":["Foundation — use History of Computing and Social Context to explain what the issue is.","Practice — use Technology Adoption and Unintended Consequences to examine how the issue affects the situation.","Action — use Public Benefit and Professional Responsibility to decide what should be done and why.","End with a clear action, safeguards, responsible person, and a way to review the result."],"two":[],"case":"A city replaces a manual service with an online-only portal that many residents cannot use."},{"kind":"Lesson summary","title":"History of Computing, Society, and Professional Practice","lead":"The topic is complete when its ideas lead to an informed, responsible, and reviewable professional action.","points":["Foundation: History of Computing and Social Context establish what the issue means and why it matters.","Practice: Technology Adoption and Unintended Consequences show how the issue affects real people and decisions.","Responsible action: Public Benefit and Professional Responsibility guide safeguards, accountability, and follow-through."],"two":[],"case":""}];let index=0;const $=id=>document.getElementById(id),canvas=$('canvas'),slide=$('slide'),content=$('content');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function emphasized(t){const clean=String(t??'').replace(/<\/?strong>/g,''),p=clean.split(/:\s*/,2);return p.length===2?'<strong>'+esc(p[0])+':</strong> '+esc(clean.slice(p[0].length+1).trim()):esc(clean)}function typeOf(s,n){if(n===0)return'title';if(['Whole-topic connection'].includes(s.kind))return'section';if(/Class application|Activity/i.test(s.kind))return'activity';return'content'}function render(){const s=slides[index],type=typeOf(s,index);slide.className='slide '+type;let h='';if(type==='title'){h='<span class="eyebrow">PIC 101 · '+esc('Week 1 · Session 2')+'</span><h1>'+esc(s.title)+'</h1><p class="subtitle">'+esc(s.lead)+'</p><span class="faculty">Joshua E. Nisnisan · Cronasia Foundation College</span>'}else if(type==='section'){h='<span class="eyebrow">'+esc(s.kind)+'</span><h2>'+esc(s.title)+'</h2><p class="lead">'+esc(s.lead)+'</p>'}else{h='<span class="eyebrow">'+esc(s.kind)+'</span><h2>'+esc(s.title)+'</h2>'+(s.lead?'<p class="lead">'+esc(s.lead)+'</p>':'');if(s.case)h+='<div class="case">'+esc(
