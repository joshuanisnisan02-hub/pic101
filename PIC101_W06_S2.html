<script>const slides=[{"kind":"PIC 101","title":"Digital Divide, Inclusion, and Accessibility","lead":"Week 6 · Session 2 · Professional Issues in Computing","points":[],"two":[],"case":""},{"kind":"Topic introduction","title":"What this lesson is about","lead":"This lesson explains digital divide, inclusion, and accessibility as one connected professional topic. It begins with the foundation, develops the essential ideas in a logical order, and ends by applying them to a realistic computing situation.","points":["Students will first understand the basic meaning of the topic before examining its individual ideas.","Each idea is explained in plain language and connected to an example, so the lesson can be reviewed even without a spoken explanation.","The final situation shows how the ideas guide an actual professional decision."],"two":[],"case":""},{"kind":"Foundation","title":"Where the topic begins","lead":"The foundation of digital divide, inclusion, and accessibility is that computing decisions affect people, organizations, and society. Technical knowledge explains what a system can do; professional judgment helps determine what it should do and how it should be used.","points":["A working system is not automatically a responsible system.","Professionals must consider purpose, evidence, affected people, possible harm, authorization, and follow-through.","The concepts in the next slides provide the language needed to make that judgment."],"two":[],"case":""},{"kind":"Lesson map","title":"Ideas you will learn","lead":"The lesson moves from basic meaning to professional application. These ideas are connected rather than separate definitions.","points":["Digital Divide","Inclusive Design","Accessibility","POUR Principles","Cultural Context","Equitable Access"],"two":[],"case":""},{"kind":"Foundation","title":"Digital Divide","lead":"Unequal ability to access and benefit from devices, connectivity, skills, accessible design, language, and digital support.","points":["<strong>Access divide:</strong> Some people lack devices, electricity, reliable internet, or affordable data.","<strong>Skills divide:</strong> Access alone is insufficient when users lack digital literacy, language support, or assistance.","<strong>Quality divide:</strong> Older devices, slow connections, or inaccessible software create a poorer experience.","<strong>Use divide:</strong> People may use technology for entertainment but lack support for education, work, government, or financial services.","<strong>Outcome divide:</strong> Different groups receive unequal benefits even when they appear to have similar access."],"two":[],"case":""},{"kind":"Foundation","title":"Inclusive Design","lead":"Designing with varied users, abilities, contexts, cultures, devices, and constraints in mind from the beginning.","points":["<strong>Different users:</strong> Consider varied abilities, languages, devices, income, locations, and digital skills.","<strong>Possible barriers:</strong> Check whether people can perceive, understand, navigate, operate, and afford the service.","<strong>Design response:</strong> Provide flexible presentation, accessible controls, low-bandwidth support, and practical alternatives.","<strong>Real outcomes:</strong> Test with affected users and confirm that access leads to meaningful participation and benefit."],"two":[],"case":""},{"kind":"Key concept","title":"Accessibility","lead":"The quality of a product or service that allows people with disabilities to perceive, understand, navigate, interact with, and contribute to it.","points":["<strong>Assets:</strong> Identify the information, service, device, account, or person that needs protection.","<strong>Threats and weaknesses:</strong> Determine what could cause harm and which weakness could make it possible.","<strong>Controls:</strong> Use prevention, detection, response, recovery, and user awareness together.","<strong>Review:</strong> Monitor results, report warning signs, and improve controls when conditions change."],"two":[],"case":""},{"kind":"Key concept","title":"POUR Principles","lead":"Four accessibility principles: content should be perceivable, operable, understandable, and robust.","points":["<strong>Different users:</strong> Consider varied abilities, languages, devices, income, locations, and digital skills.","<strong>Possible barriers:</strong> Check whether people can perceive, understand, navigate, operate, and afford the service.","<strong>Design response:</strong> Provide flexible presentation, accessible controls, low-bandwidth support, and practical alternatives.","<strong>Real outcomes:</strong> Test with affected users and confirm that access leads to meaningful participation and benefit."],"two":[],"case":""},{"kind":"Professional meaning","title":"Cultural Context","lead":"The beliefs, language, norms, practices, and expectations that influence how people interpret and use technology.","points":["<strong>Main components:</strong> This idea includes the people, processes, technologies, rules, and outcomes connected to cultural context.","<strong>How it is examined:</strong> Use the definition—the beliefs, language, norms, practices, and expectations that influence how people interpret and use technology.—to identify what evidence should be checked.","<strong>Why it matters:</strong> Understanding these components helps professionals move from a general term to a clear and responsible action."],"two":[],"case":""},{"kind":"Professional meaning","title":"Equitable Access","lead":"Providing the support or alternatives different users need so they have a fair opportunity to participate and benefit.","points":["<strong>Assets:</strong> Identify the information, service, device, account, or person that needs protection.","<strong>Threats and weaknesses:</strong> Determine what could cause harm and which weakness could make it possible.","<strong>Controls:</strong> Use prevention, detection, response, recovery, and user awareness together.","<strong>Review:</strong> Monitor results, report warning signs, and improve controls when conditions change."],"two":[],"case":""},{"kind":"Whole-topic connection","title":"How the ideas fit together","lead":"Digital Divide, Inclusion, and Accessibility is best understood as a sequence: establish the foundation, examine the people and conditions involved, then decide what responsible practice requires.","points":["Begin with Digital Divide and Inclusive Design to understand the foundation.","Use Accessibility and POUR Principles to examine how the issue operates in practice.","Apply Cultural Context and Equitable Access when choosing and defending the professional response."],"two":[],"case":""},{"kind":"Application","title":"Read the situation","lead":"Use the lesson concepts to understand the problem before choosing an answer.","points":["Identify what is already known and what still needs verification.","Determine who can benefit, who may be harmed, and who has authority or responsibility.","Connect the situation to the lesson concepts before recommending action."],"two":[],"case":"A public learning platform works only on new phones and high-speed connections."},{"kind":"Guided explanation","title":"How to analyze the situation","lead":"A responsible analysis moves from evidence to action. It does not begin with a quick opinion.","points":["Facts — separate verified information from assumptions.","People — identify direct and indirect stakeholders, especially those with less power.","Responsibilities — connect the situation to professional duties, rules, rights, and standards.","Options — compare realistic actions and the likely effect of each one.","Safeguards — reduce foreseeable harm and identify who will review the result."],"two":[],"case":""},{"kind":"Worked example","title":"A defensible professional response","lead":"A strong response states what should happen, why it is justified, and how people will be protected.","points":["Recommended direction: pause or limit the action when essential evidence, authorization, or safeguards are missing.","Reason: professional decisions must consider the lesson concepts and the effect on people—not only speed, convenience, or cost.","Safeguard: verify the missing information, involve the correct authority, document the decision, and review the result after action."],"two":[],"case":"A public learning platform works only on new phones and high-speed connections."},{"kind":"Class application","title":"Discuss and decide","lead":"Work with a partner or small group. Explain the case in your own words, then develop one professional recommendation.","points":["Use at least three concepts from the lesson.","State one benefit, one possible harm, and one missing fact.","Give a specific action, reason, safeguard, responsible person, and review point.","Be ready to explain why your response is stronger than at least one alternative."],"two":[],"case":""},{"kind":"Check your understanding","title":"Can you explain the lesson?","lead":"Answer using complete thoughts rather than copying a definition.","points":["What is the central idea of Digital Divide, Inclusion, and Accessibility?","How do Digital Divide and Inclusive Design establish the foundation?","Why are Accessibility and POUR Principles important in practice?","How do Cultural Context and Equitable Access improve the final decision?","Give a new example where this lesson would matter."],"two":[],"case":""},{"kind":"Lesson summary","title":"Digital Divide, Inclusion, and Accessibility","lead":"The topic is complete when its ideas lead to an informed, responsible, and reviewable professional action.","points":["Foundation: Digital Divide and Inclusive Design establish what the issue means and why it matters.","Practice: Accessibility and POUR Principles show how the issue affects real people and decisions.","Responsible action: Cultural Context and Equitable Access guide safeguards, accountability, and follow-through."],"two" x===slides.length-1;[...document.querySelectorAll('.dot')].forEach((d,n)=>d.classList.toggle('active',n===index));location.hash='slide-'+(index+1)}function go(n){index=Math.max(0,Math.min(slides.length-1,n));render()}function scale(){const s=Math.min(innerWidth/1920,innerHeight/1080);canvas.style.setProperty('--scale',s)}$('prev').onclick=()=>go(index-1);$('next').onclick=()=>go(index+1);$('home').onclick=()=>location.href='index.html';$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();$('dots').innerHTML=slides.map((_,n)=>'<button class="dot" aria-label="Go to slide '+(n+1)+'" data-n="'+n+'"></button>').join('');document.querySelectorAll('.dot').forEach(d=>d.onclick=()=>go(+d.dataset.n));$('thumbs').innerHTML=slides.map((s,n)=>'<button class="thumb" data-n="'+n+'"><small>'+esc(s.kind)+'</small><b>'+esc(s.title)+'</b></button>').join('');document.querySelectorAll('.thumb').forEach(b=>b.onclick=()=>{go(+b.dataset.n);$('overview').classList.remove('open')});$('close').onclick=()=>$('overview').classList.remove('open');addEventListener('resize',scale);addEventListener('keydown',e=>{if($('overview').classList.contains('open')){if(e.key==='Escape')$('overview').classList.remove('open');return}if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(index+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(index-1)}if(e.key==='Home')go(0);if(e.key==='End')go(slides.length-1);if(e.key.toLowerCase()==='f')$('full').click();if(e.key.toLowerCase()==='o')$('overview').classList.add('open')});const hash=location.hash.match(/slide-(\d+)/);if(hash)index=Math.min(slides.length-1,Math.max(0,+hash[1]-1));scale();render();</script></body></html>
