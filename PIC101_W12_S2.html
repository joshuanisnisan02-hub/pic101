-size:29px;line-height:1.5;color:#dbe4f2;max-width:1180px;margin-top:25px}.list{display:grid;gap:10px;max-width:1580px;margin-top:8px}.item{position:relative;padding:10px 12px 10px 34px;border-top:1px solid var(--line);font-size:25px;line-height:1.38;color:#343a44}.item::before{content:"";position:absolute;left:4px;top:24px;width:10px;height:10px;border-radius:50%;background:var(--accent)}.item strong{color:var(--accent)}.card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:18px}.card{min-height:118px;padding:22px 24px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--accent) 5%,var(--paper));font-size:24px;line-height:1.35;color:#343a44}.card strong{display:block;color:var(--accent);font-family:Georgia,"Times New Roman",serif;font-size:27px;margin-bottom:7px}.case{margin-top:22px;padding:25px 30px;border-left:6px solid var(--accent);background:var(--accent-soft);font-family:Georgia,"Times New Roman",serif;font-size:29px;line-height:1.4;color:#1c2e4c}.activity .case{background:#fffdf8}.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:24px}.summary-card{padding:28px;border-top:5px solid var(--accent);background:var(--white);font-size:25px;line-height:1.42;color:#353c47}.counter{position:absolute;right:42px;top:34px;font:18px Consolas,"Courier New",monospace;color:#66707e}.brand{position:absolute;left:44px;bottom:31px;font:17px Consolas,"Courier New",monospace;color:#81858b}.section .counter,.section .brand{color:#c7d5ec}.chrome{position:fixed;inset:0;pointer-events:none;z-index:20}.home,.full,.prev,.next{pointer-events:auto;position:absolute;border:1px solid #ffffff45;background:#0d2a54e8;color:#fff;border-radius:9px;padding:10px 14px;font:700 14px "Segoe UI",Arial;cursor:pointer;box-shadow:0 5px 18px #0003}.home{left:16px;top:16px}.full{right:16px;top:16px}.prev{left:16px;bottom:16px}.next{right:16px;bottom:16px;background:#c88916;color:#101826;border-color:#f0c367}.home:hove <script>const slides=[{"kind":"PIC 101","title":"Project Responsibility, Documentation, and Change Control","lead":"Week 12 · Session 2 · Professional Issues in Computing","points":[],"two":[],"case":""},{"kind":"Topic introduction","title":"What this lesson is about","lead":"This lesson explains project responsibility, documentation, and change control as one connected professional topic. It begins with the foundation, develops the essential ideas in a logical order, and ends by applying them to a realistic computing situation.","points":["Students will first understand the basic meaning of the topic before examining its individual ideas.","Each idea is explained in plain language and connected to an example, so the lesson can be reviewed even without a spoken explanation.","The final situation shows how the ideas guide an actual professional decision."],"two":[],"case":""},{"kind":"Foundation","title":"Where the topic begins","lead":"The foundation of project responsibility, documentation, and change control is that computing decisions affect people, organizations, and society. Technical knowledge explains what a system can do; professional judgment helps determine what it should do and how it should be used.","points":["A working system is not automatically a responsible system.","Professionals must consider purpose, evidence, affected people, possible harm, authorization, and follow-through.","The concepts in the next slides provide the language needed to make that judgment."],"two":[],"case":""},{"kind":"Lesson map","title":"Ideas you will learn","lead":"The lesson moves from basic meaning to professional application. These ideas are connected rather than separate definitions.","points":["Project Responsibility","Requirements","Technical Documentation","Change Control","Traceability","Accountability"],"two":[],"case":""},{"kind":"Foundation","title":"Project Responsibility","lead":"Clear ownership of tasks, decisions, quality, communication, risks, and outcomes throughout a project.","points":["<strong>Situation:</strong> Begin with verified facts, missing information, and the purpose of the action.","<strong>Affected people:</strong> Identify who benefits, who carries risk, and who has less influence over the decision.","<strong>Standards for judgment:</strong> Consider duties, rights, fairness, consequences, professional principles, and possible alternatives.","<strong>Responsible result:</strong> Choose a clear action with safeguards, an accountable owner, documentation, and follow-up."],"two":[],"case":""},{"kind":"Foundation","title":"Requirements","lead":"Documented needs, constraints, behaviors, and acceptance conditions that a system is expected to satisfy.","points":["<strong>Expected result:</strong> State what the system or project must do and the conditions it must satisfy.","<strong>Evidence:</strong> Use reviews, tests, records, and measurable acceptance criteria instead of assumptions.","<strong>Control of work:</strong> Assign responsibility and document decisions, defects, approvals, and changes.","<strong>Readiness:</strong> Release or accept work only when evidence shows that important risks are controlled."],"two":[],"case":""},{"kind":"Key concept","title":"Technical Documentation","lead":"Organized information that explains system design, setup, operation, decisions, interfaces, changes, and support procedures.","points":["<strong>Expected result:</strong> State what the system or project must do and the conditions it must satisfy.","<strong>Evidence:</strong> Use reviews, tests, records, and measurable acceptance criteria instead of assumptions.","<strong>Control of work:</strong> Assign responsibility and document decisions, defects, approvals, and changes.","<strong>Readiness:</strong> Release or accept work only when evidence shows that important risks are controlled."],"two":[],"case":""},{"kind":"Key concept","title":"Change Control","lead":"A formal process for requesting, analyzing, approving, implementing, documenting, and reviewing changes.","points":["<strong>Expected result:</strong> State what the system or project must do and the conditions it must satisfy.","<strong>Evidence:</strong> Use reviews, tests, records, and measurable acceptance criteria instead of assumptions.","<strong>Control of work:</strong> Assign responsibility and document decisions, defects, approvals, and changes.","<strong>Readiness:</strong> Release or accept work only when evidence shows that important risks are controlled."],"two":[],"case":""},{"kind":"Professional meaning","title":"Traceability","lead":"The ability to connect a requirement to its design, implementation, test evidence, approval, and later changes.","points":["<strong>Expected result:</strong> State what the system or project must do and the conditions it must satisfy.","<strong>Evidence:</strong> Use reviews, tests, records, and measurable acceptance criteria instead of assumptions.","<strong>Control of work:</strong> Assign responsibility and document decisions, defects, approvals, and changes.","<strong>Readiness:</strong> Release or accept work only when evidence shows that important risks are controlled."],"two":[],"case":""},{"kind":"Professional meaning","title":"Accountability","lead":"Being answerable for a decision by documenting it, explaining it, accepting responsibility, correcting problems, and following through.","points":["<strong>Situation:</strong> Begin with verified facts, missing information, and the purpose of the action.","<strong>Affected people:</strong> Identify who benefits, who carries risk, and who has less influence over the decision.","<strong>Standards for judgment:</strong> Consider duties, rights, fairness, consequences, professional principles, and possible alternatives.","<strong>Responsible result:</strong> Choose a clear action with safeguards, an accountable owner, documentation, and follow-up."],"two":[],"case":""},{"kind":"Whole-topic connection","title":"How the ideas fit together","lead":"Project Responsibility, Documentation, and Change Control is best understood as a sequence: establish the foundation, examine the people and conditions involved, then decide what responsible practice requires.","points":["Begin with Project Responsibility and Requirements to understand the foundation.","Use Technical Documentation and Change Control to examine how the issue operates in practice.","Apply Traceability and Accountability when choosing and defending the professional response."],"two":[],"case":""},{"kind":"Application","title":"Read the situation","lead":"Use the lesson concepts to understand the problem before choosing an answer.","points":["Identify what is already known and what still needs verification.","Determine who can benefit, who may be harmed, and who has authority or responsibility.","Connect the situation to the lesson concepts before recommending action."],"two":[],"case":"A client requests a major change through chat, and the team implements it without updating records."},{"kind":"Guided explanation","title":"How to analyze the situation","lead":"A responsible analysis moves from evidence to action. It does not begin with a quick opinion.","points":["Facts — separate verified information from assumptions.","People — identify direct and indirect stakeholders, especially those with less power.","Responsibilities — connect the situation to professional duties, rules, rights, and standards.","Options — compare realistic actions and the likely effect of each one.","Safeguards — reduce foreseeable harm and identify who will review the result."],"two":[],"case":""},{"kind":"Worked example","title":"A defensible professional response","lead":"A strong response states what should happen, why it is justified, and how people will be protected.","points":["Recommended direction: pause or limit the action when essential evidence, authorization, or safeguards are missing.","Reason: professional decisions must consider the lesson concepts and the effect on people—not only speed, convenience, or cost.","Safeguard: verify the missing information, involve the correct authority, document the decision, and review the result after action."],"two":[],"case":"A client requests a major change through chat, and the team implements it without updating records."},{"kind":"Class application","title":"Discuss and decide","lead":"Work with a partner or small group. Explain the case in your own words, then develop one professional recommendation.","points":["Use at least three concepts from the lesson.","State one benefit, one possible harm, and one missing fact.","Give a specific action, reason, safeguard, responsible person, and review point.","Be ready to explain why your response is stronger than at least one alternative."],"two":[],"case":""},{"kind":"Check your understanding","title":"Can you explain the lesson?","lead":"Answer using complete thoughts rather than copying a definition.","points":["What is the central idea of Project Responsibility, Documentation, and Change Control?","How do Project Responsibility and Requirements establish the foundation?","Why are Technical Documentation and Change Control important in practice?","How do Traceability and Accountability improve the final decision?","Give a new example where this lesson would matter."],"two":[],"case":""},{"kind":"Lesson summary","title":"Project Responsibility, Documentation, and Change Control","lead":"The topic is complete when its ideas lead to an informed, responsible, and reviewable professional action.","points":["Foundation: Project Responsibility and Requirements establish what the issue means and why it matters.","Practice: Technical Documentation and Change Control show how the issue affects real people and decisions.","Responsible action: Traceability and Accountability guide safeguards, accountability, and follow-through."],"two":[],"case":""}];let index=0;const $=id=>document.getElementById(id),canvas=$('canvas'),slide=$('slide'),content=$('content');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function emphasized(t){const clean=String(t??'').replace(/<\/?strong>/g,''),p=clean.split(/:\s*/,2);return p.length===2?'<strong>'+esc(p[0])+':</strong> '+esc(clean.slice(p[0].length+1).trim()):esc(clean)}function typeOf(s,n){if(n===0)return'title';if(['Whole-topic connection'].includes(s.kind))return'section';if(/Class application|Activity/i.test(s.kind))return'activity';return'content'}function render(){const s=slides[index],type=typeOf(s,index);slide.className='slide '+type;let h='';if(type==='title'){h='<span class="eyebrow">PIC 101 · '+esc('Week 12 · Session 2')+'</span><h1>'+esc(s.title)+'</h1><p class="subtitle">'+esc(s.lead)+'</p><span class="faculty">Joshua E. Nisnisan · Cronasia Foundation College</span>'}else if(type==='section'){h='<span class="eyebrow">'+esc(s.kind)+'</span><h2>'+esc(s.title)+'</h2><p class="lead">'+esc(s.lead)+'</p>'}else{h='<span class="eyebrow">'+esc(s.kind)+'</span><h2>'+esc(s.title)+'</h2>'+(s.lead?'<p class="lead">'+esc(s.lead)+'</p>':'');if(s.case)h+='<div class="case">'+esc(s.case)+'</div>';if(s.two?.length)h+='<div class="summary-grid">'+s.two.map(p=>'<div class="summary-card"><strong>'+esc(p[0])+'</strong><br>'+esc(p[1])+'</div>').join('')+'</div>';if(s.points?.length){if(s.kind==='Lesson map')h+='<div class="card-grid">'+s.points.map(p=>'<div class="card">'+emphasized(p)+'</div>').join('')+'</div>';else if(s.kind==='Lesson summary')h+='<div class="summary-grid">'+s.points.map(p=>'<div class="summary-card">'+emphasized(p)+'</div>').join('')+'</div>';else h+='<div class="list">'+s.points.map(p=>'<div class="item">'+emphasized(p)+'</div>').join('')+'</div>'}}content.innerHTML=h;$('counter').textContent=(index+1)+' / '+slides.length;$('prev').disabled=index===0;$('next').disabled=index===slides.length-1;[...document.querySelectorAll('.dot')].forEach((d,n)=>d.classList.toggle('active',n===index));location.hash='slide-'+(index+1)}function go(n){index=Math.max(0,Math.min(slides.length-1,n));render()}function scale(){const s=Math.min(innerWidth/1920,innerHeight/1080);canvas.style.setProperty('--scale',s)}$('prev').onclick=()=>go(index-1);$('next').onclick=()=>go(index+1);$('home').onclick=()=>location.href='index.html';$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();$('dots').innerHTML=slides.map((_,n)=>'<button class="dot" aria-label="Go to slide '+(n+1)+'" data-n="'+n+'"></button>').join('');document.querySelectorAll('.dot').forEach(d=>d.onclick=()=>go(+d.dataset.n));$('thumbs').innerHTML=slides.map((s,n)=>'<button class="thumb" data-n="'+n+'"><small>'+esc(s.kind)+'</small><b>'+esc(s.title)+'</b></button>').join('');document.querySelectorAll('.thumb').forEach(b=>b.onclick=()=>{go(+b.dataset.n);$('overview').classList.remove('open')});$('close').onclick=()=>$('overview').classList.remove('open');addEventListener('resize',scale);addEventListener('keydown',e=>{if($('overview').classList.contains('open')){if(e.key==='Escape')$('overview').classList.remove('open');return}if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(index+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(index-1)}if(e.key==='Home')go(0);if(e.key==='End')go(slides.length-1);if(e.key.toLowerCase()==='f')$('full').click();if(e.key.toLowerCase()==='o')$('overview').classList.add('open')});const hash=location.hash.match(/slide-(\d+)/);if(hash)index=Math.min(slides.length-1,Math.max(0,+hash[1]-1));scale();render();</script></body></html>
